<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf4ef">
  <meta name="description" content="Một lời nhắn nhỏ, chỉ dành cho em.">
  <title>Gửi Ánh nhỏ ♡</title>
  <link rel="preload" as="image" href="image/anh%20ny.jpg">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="desktop-note" aria-hidden="true">a little story<br><span>just for you.</span></div>
  <main class="story" aria-label="Một lời nhắn dành cho Ánh">
    <header class="masthead"><span class="brand">a little love <span>♡</span></span><span class="private-note">CHỈ DÀNH CHO EM</span></header>
    <div id="scene"></div>
    <footer><span class="footer-line"></span><span>từ anh, với tất cả yêu thương</span><span class="footer-line"></span></footer>
  </main>
  <div id="effects" aria-hidden="true"></div>
  <noscript>Bật JavaScript để xem câu chuyện nhỏ dành cho em nhé.</noscript>
</body>
</html>
